<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio DEV</title>
    <style>
        :root {
    --bg-dark: #0f0f12;
    --card-bg: #1a1a20;
    --accent: #bb86fc;
    --secondary: #03dac6;
    --text-main: #ffffff;
    --text-dim: #a0a0a0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-dark);
    background-image: radial-gradient(circle at 20% 30%, #251a3a 0%, var(--bg-dark) 70%);
    color: var(--text-main);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    padding: 20px;
}

.player-card {
    background: var(--card-bg);
    padding: 40px;
    border-radius: 24px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.05);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

h1 {
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
}

#metadata {
    font-size: 0.75rem;
    background: rgba(187, 134, 252, 0.15);
    color: var(--accent);
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: bold;
}

/* --- Album Art --- */
.album-art {
    background: linear-gradient(45deg, #2a2a2a, #3a3a3a);
    margin: 0 auto 25px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    width: 240px;
    height: 240px;
    overflow: hidden;
    position: relative;
    transition: box-shadow 0.4s ease;
}

.album-art.has-cover {
    box-shadow: 0 10px 40px rgba(187, 134, 252, 0.35), 0 0 0 1px rgba(187,134,252,0.15);
}

#cover-img {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 16px;
    opacity: 0;
    transition: opacity 0.4s ease;
}

#cover-img.visible { opacity: 1; }

#cover-emoji {
    font-size: 4rem;
    transition: opacity 0.3s ease;
    position: relative;
    z-index: 1;
}

/* --- Track Info --- */
.track-info { margin-bottom: 25px; }
#track-title  { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; display: block; }
#track-artist { font-size: 1rem; color: var(--accent); display: block; }
#track-album  { font-size: 0.85rem; color: var(--text-dim); margin-top: 4px; display: block; }

/* --- Progress Bar --- */
.progress-container { width: 100%; margin-bottom: 30px; }

.progress-bar {
    width: 100%;
    height: 6px;
    background: #333;
    border-radius: 3px;
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--secondary));
    border-radius: 3px;
}

.time-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 8px;
}

/* --- Controls --- */
.controls {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
}

#play-btn {
    background: var(--accent);
    color: #121212;
    border: none;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    font-size: 0;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(187, 134, 252, 0.4);
    -webkit-tap-highlight-color: transparent;
}

#play-btn::before {
    content: '';
    display: block;
    width: 0; height: 0;
    border-style: solid;
    border-width: 10px 0 10px 18px;
    border-color: transparent transparent transparent #121212;
    margin-left: 5px;
}

#play-btn.playing::before {
    width: 18px;
    height: 18px;
    background: #121212;
    border: none;
    margin: 0;
}

#play-btn.loading::before {
    display: none;
}

#play-btn.loading {
    background: transparent;
    box-shadow: none;
    cursor: default;
    pointer-events: none;
}

#play-btn.loading::after {
    content: '';
    display: block;
    width: 32px;
    height: 32px;
    border: 3px solid rgba(187, 134, 252, 0.25);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

#play-btn:hover { transform: scale(1.05); filter: brightness(1.1); }
#play-btn:active { transform: scale(0.95); }

/* --- Subtitles --- */
#subtitles {
    min-height: 3em;
    margin-top: 30px;
    font-size: 1rem;
    line-height: 1.5;
    color: var(--secondary);
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    border-top: 1px solid rgba(255,255,255,0.05);
    padding-top: 20px;
}

#debug { display: none; }

/* --- Volume --- */
.volume-container {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    width: 100%;
    max-width: 200px;
}

.volume-icon { font-size: 1.2rem; color: var(--text-dim); }

#volume-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: #333;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
}

#volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px; height: 14px;
    background: var(--secondary);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(3, 218, 198, 0.5);
    transition: transform 0.2s;
    border: none;
}

#volume-slider::-moz-range-thumb {
    width: 14px; height: 14px;
    background: var(--secondary);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(3, 218, 198, 0.5);
    transition: transform 0.2s;
    border: none;
}

#volume-slider::-webkit-slider-thumb:hover { transform: scale(1.3); }
#volume-slider::-moz-range-thumb:hover { transform: scale(1.3); }

/* --- Schedule --- */
.schedule-container {
    margin-top: 25px;
    padding-top: 15px;
    border-top: 1px solid rgba(255,255,255,0.05);
    position: relative;
}

.schedule-container h2 {
    font-size: 0.7rem;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 15px;
    text-align: center;
}

.timeline-single-row { display: flex; flex-direction: column; align-items: center; }

.row {
    display: flex;
    justify-content: space-between;
    width: 100%;
}

.row div {
    flex: 1;
    text-align: center;
    transition: all 0.3s ease;
    opacity: 0.4;
    cursor: default;
    padding: 5px 0;
}

.row div.focus { opacity: 1; transform: scale(1.15); color: var(--secondary); }

.events { font-size: 1.1rem; }
.hours  { font-size: 0.75rem; font-family: monospace; color: var(--text-dim); }
.descs  { font-size: 0.65rem; color: var(--text-dim); margin-top: 4px; }

.timeline-line {
    height: 1px;
    width: 100%;
    background: rgba(255,255,255,0.1);
    margin: 8px 0;
    position: relative;
}

.timeline-line::after {
    content: '';
    position: absolute;
    top: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 18%;
    height: 5px;
    background: var(--accent);
    border-radius: 4px;
    box-shadow: 0 0 10px var(--accent);
}

/* --- Portrait mobile --- */
@media (max-width: 768px) and (orientation: portrait) {
    .player-card { padding: 25px; border-radius: 18px; }
    .album-art   { width: 200px; height: 200px; }
    #cover-emoji { font-size: 3rem; }
    #track-title  { font-size: 1.3rem; }
    #track-artist { font-size: 0.95rem; }
}

@media (max-width: 480px) and (orientation: portrait) {
    body { padding: 10px; }
    .player-card  { padding: 20px; border-radius: 16px; }
    .header       { flex-direction: column; gap: 10px; }
    .album-art    { width: 160px; height: 160px; }
    #cover-emoji  { font-size: 2.5rem; }
    #track-title  { font-size: 1.1rem; }
    #track-artist { font-size: 0.9rem; }
    #play-btn     { width: 60px; height: 60px; }
    .volume-container { max-width: 100%; }
    #subtitles    { font-size: 0.9rem; min-height: 0.0em; }
}

/* --- Portrait mobile petit écran : masquer pochette --- */
@media (max-height: 800px) and (orientation: portrait) {
    .album-art { width: 100px; height: 100px; }
    .volume-container   { display: none; }
    .header { display: none; }
}

/* --- Paysage mobile (hauteur ≤ 500px) --- */
@media (orientation: landscape) and (max-height: 500px) {

    body {
        align-items: flex-start;
        padding: 6px 10px;
    }

    .player-card {
        padding: 10px 16px;
        border-radius: 12px;
        max-width: 100%;
        display: grid;
        grid-template-columns: 85px 1fr;
        grid-template-areas:
            "art header"
            "art info"
            "art progress"
            "art controls"
            "sched sched";
        column-gap: 16px;
        row-gap: 2px;
        text-align: left;
    }

    .album-art {
        grid-area: art;
        width: 85px;
        height: 85px;
        margin: 0 auto;
        align-self: center;
        justify-self: center;
        border-radius: 10px;
    }

    .header             { grid-area: header;   margin-bottom: 0; }
    .track-info         { grid-area: info;     margin-bottom: 0; }
    .progress-container { grid-area: progress; margin-bottom: 0; }
    .controls           { grid-area: controls; flex-direction: row; justify-content: flex-start; gap: 12px; }
    .schedule-container { grid-area: sched;    margin-top: 6px; padding-top: 6px; }

    #subtitles { display: none; }

    #track-title  { font-size: 0.9rem; }
    #track-artist { font-size: 0.78rem; }
    #track-album  { font-size: 0.7rem; }

    #play-btn { width: 44px; height: 44px; }
    .volume-container   { display: none; }

    h1        { font-size: 0.75rem; }
    #metadata { font-size: 0.65rem; padding: 3px 8px; }

    .schedule-container h2 { margin-bottom: 8px; }
    .events { font-size: 0.9rem; }
    .hours  { font-size: 0.65rem; }
    .descs  { font-size: 0.55rem; }
}

/* --- Grand écran PC (largeur ≥ 700px, hauteur ≥ 501px) --- */
@media (min-width: 700px) and (min-height: 501px) {

    body {
        align-items: center;
        padding: 40px;
    }

    .player-card {
        max-width: 1100px;
        padding: 50px 60px;
        border-radius: 32px;
        display: grid;
        grid-template-columns: 360px 1fr;
        grid-template-areas:
            "art header"
            "art info"
            "art progress"
            "art controls"
            "sched sched"
            "sub sub";
        column-gap: 60px;
        row-gap: 16px;
        text-align: left;
    }

    .album-art {
        grid-area: art;
        width: 340px;
        height: 340px;
        margin: 0 auto;
        align-self: center;
        justify-self: center;
        border-radius: 20px;
    }

    #cover-emoji  { font-size: 6rem; }
    #track-title  { font-size: 2.2rem; }
    #track-artist { font-size: 1.3rem; }
    #track-album  { font-size: 1rem; }

    .header             { grid-area: header;   margin-bottom: 0; }
    h1                  { font-size: 1.1rem; letter-spacing: 3px; }
    #metadata           { font-size: 0.9rem; padding: 6px 16px; }

    .track-info         { grid-area: info;     margin-bottom: 0; }
    .progress-container { grid-area: progress; margin-bottom: 0; }
    .progress-bar       { height: 8px; }

    .controls           { grid-area: controls; flex-direction: row; justify-content: flex-start; gap: 24px; }
    #play-btn           { width: 90px; height: 90px; }
    #play-btn::before   { border-width: 14px 0 14px 24px; }
    #play-btn.playing::before { width: 24px; height: 24px; }
    .volume-container   { max-width: 260px; margin-top: 0; }

    .schedule-container { grid-area: sched; margin-top: 20px; padding-top: 20px; }
    .schedule-container h2 { font-size: 0.85rem; margin-bottom: 16px; }
    .events             { font-size: 1.5rem; }
    .hours              { font-size: 0.9rem; }
    .descs              { font-size: 0.8rem; }

    #subtitles          { grid-area: sub; margin-top: 0; font-size: 1.2rem; min-height: 2em; }
}
    </style>
</head>
<body>

<div class="player-card">
    <div class="header">
        <h1>Direct</h1>
        <div id="metadata">Connexion...</div>
    </div>

    <div class="album-art" id="album-art-container">
        <img id="cover-img" src="" alt="Pochette" />
        <span id="cover-emoji">📻</span>
    </div>

    <div class="track-info">
        <span id="track-title">Titre</span>
        <span id="track-artist">Artiste</span>
        <span id="track-album">Album</span>
    </div>

    <div class="progress-container">
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="time-info">
            <span id="current-time">LIVE</span>
            <span id="duration">--:--</span>
        </div>
    </div>

    <div class="controls">
        <audio id="radio-audio">
            <!-- src injecté dynamiquement par détectStream() -->
        </audio>

        <button id="play-btn" onclick="togglePlay()"></button>
        <div class="volume-container">
            <span class="volume-icon">🔈</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
            <span class="volume-icon">🔊</span>
        </div>
    </div>

    <div id="subtitles"></div>
    <div class="schedule-container">
        <h2>Programme</h2>
        <div class="timeline-wrapper">
            <div id="zoom-timeline" class="timeline-single-row"></div>
            <div id="timeline-tooltip" class="timeline-tooltip"></div>
        </div>
    </div>
    <div id="debug"></div>
</div>

<script>
const audio    = document.getElementById('radio-audio');
const subDiv   = document.getElementById('subtitles');
const debugDiv = document.getElementById('debug');
const playBtn  = document.getElementById('play-btn');
const album    = document.getElementById('track-album');
const artist   = document.getElementById('track-artist');
const title    = document.getElementById('track-title');
const time     = document.getElementById('current-time');
const duration = document.getElementById('duration');
const progressFill  = document.getElementById('progress-fill');
const coverImg      = document.getElementById('cover-img');

let displayedData = null;
let currentData = null;
let cuesIndex          = [];
let hasSubtitles       = false;
let lastTrackTitle     = "";
let isFetching         = false;
let lastCoverUrl       = "";

let serverStartTime    = 0; 
let playClickTime      = 0; 
let offsetAtPlay       = 0; 
let baseServerNow      = 0;
let baseLocalTime      = 0;
let anchorServerPos    = 0;
let anchorAudioTime    = 0;
// Réutilise le dernier buffer mesuré pour que la progression en pause
// soit cohérente avec la progression après play (évite le saut au démarrage).
let icecastBufferDelay = parseFloat(localStorage.getItem('icecastBufferDelay') || '0');

let STREAM_URL = '/icecast/radio-public'; // fallback par défaut

async function detectStream() {
    const localHosts = ['192.168.1.20', 'radio-local.adrien-dev.fr'];
    if (localHosts.includes(window.location.hostname)) {
        STREAM_URL = '/icecast/radio-local';
    } else {
        STREAM_URL = '/icecast/radio-public';
    }
    audio.src = STREAM_URL + '?t=' + Date.now();
    console.log('Stream sélectionné :', STREAM_URL);
}

function getStatusUrl() {
    if (STREAM_URL.includes('radio-local')) {
        return '/data/status-radio-local.json';
    }
    return '/data/status-radio-public.json';
}
function getCoverUrl() {
    if (STREAM_URL.includes('radio-local')) {
        return '/cover-radio-local.jpg';
    }
    return '/cover-radio-public.jpg';
}



audio.addEventListener('ended', () => {
    playBtn.classList.remove('playing', 'loading');
    anchorAudioTime = 0;
});

audio.addEventListener('error', (e) => {
    const error = audio.error;
    playBtn.classList.remove('playing', 'loading');
    anchorAudioTime = 0;

    // Retry automatique après 3s si c'est une erreur réseau
    if (error.code === 2) {
        console.warn("Erreur réseau — tentative de reconnexion dans 3s...");
        setTimeout(() => {
            if (audio.paused) return; // L'utilisateur a peut-être voulu pause
            const vol = audio.volume;
            audio.src = STREAM_URL + '?t=' + Date.now();
            audio.volume = vol;
            audio.play().catch(console.error);
        }, 3000);
    }
});

let waitingTimeout = null;

audio.addEventListener('waiting', () => {
    if (!audio.paused) {
        playBtn.classList.add('loading');
        playBtn.classList.remove('playing');

        waitingTimeout = setTimeout(() => {
            if (!audio.paused && playBtn.classList.contains('loading')) {
                console.log("Reconnexion du flux...");
                const vol = audio.volume;
                audio.src = STREAM_URL + '?t=' + Date.now();
                audio.volume = vol;
                audio.play().catch(err => {
                    console.error("Échec de la reprise auto:", err);
                    playBtn.classList.remove('playing', 'loading');
                });
            }
        }, 5000); 
    }
});

audio.addEventListener('playing', () => {
    clearTimeout(waitingTimeout);
    playBtn.classList.remove('loading');
    playBtn.classList.add('playing');

    const now = Date.now() / 1000;
    const activeData = displayedData || currentData;
    if (!activeData) return;
    
    const start = new Date(activeData.startedAt).getTime() / 1000;

    const secondsSinceFetch = now - activeData.fetchedAt;
    let offsetAtPlay2 = (activeData.serverNow + secondsSinceFetch) - start;
    icecastBufferDelay = offsetAtPlay2 - offsetAtPlay;
    console.log(icecastBufferDelay);


    // --- LA CLÉ EST ICI ---
    // On définit l'ancre de position au moment PRÉCIS où la lecture commence.
    // On prend le temps serveur actuel et on retire le délai de buffer.
    anchorServerPos = (baseServerNow + (now - baseLocalTime)) - start - icecastBufferDelay;
    anchorAudioTime = audio.currentTime;

    if (icecastBufferDelay > 0) {
        localStorage.setItem('icecastBufferDelay', icecastBufferDelay.toFixed(2));
    }
});

function normalizeVtt(url) {
    return url ? url.split('?')[0] : '';
}

function parseVttTime(t) {
    const p = t.trim().replace(',', '.').split(':').map(Number);
    if (p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2];
    return p[0] * 60 + p[1];
}

function parseVTT(vttText) {
    const cues = [];
    const blocks = vttText.split(/\n\s*\n/);
    blocks.forEach(block => {
        const lines = block.split('\n').map(l => l.trim());
        const timeLine = lines.find(l => l.includes('-->'));
        if (timeLine) {
            const [startStr, endStr] = timeLine.split('-->');
            const start = parseVttTime(startStr);
            const end = parseVttTime(endStr);
            const textIdx = lines.indexOf(timeLine) + 1;
            const text = lines.slice(textIdx).join(' ').trim();
            if (text) cues.push({ start, end, text });
        }
    });
    return cues;
}

function togglePlay() {
    if (audio.paused) {
        const currentVolume = audio.volume;
        audio.load();
        audio.src = STREAM_URL + '?t=' + Date.now();
        audio.volume = currentVolume;
        audio.play();
        playBtn.classList.remove('playing');
        playBtn.classList.add('loading');

        if (currentData) {
            const clickLocalTime = Date.now() / 1000;
            playClickTime = clickLocalTime;
            const start = new Date(currentData.startedAt).getTime() / 1000;
            const secondsSinceFetch = clickLocalTime - currentData.fetchedAt;
            offsetAtPlay = (currentData.serverNow + secondsSinceFetch) - start;
        }
    } else {
        audio.pause();
        anchorAudioTime = 0;
        playBtn.classList.remove('playing');
        subDiv.innerHTML = "";
    }
}

const coverEmoji = document.getElementById('cover-emoji');
const albumArtContainer = document.getElementById('album-art-container');

function updateCoverArt() {
    setTimeout(() => {
        const tempImg = new Image();
        tempImg.onload = () => {
            coverImg.src = tempImg.src;
            coverImg.classList.add('visible');
            coverEmoji.style.opacity = '0';
            albumArtContainer.classList.add('has-cover');
        };
        tempImg.onerror = () => {
            coverImg.classList.remove('visible');
            coverEmoji.style.opacity = '1';
            albumArtContainer.classList.remove('has-cover');
        };
        tempImg.src = getCoverUrl() + "?t=" + Date.now();
    }, 500);
}

async function fetchMetadata() {
    if (isFetching) return;
    isFetching = true;
    try {
        const res = await fetch(getStatusUrl() + '?t=' + Date.now());
        const data = await res.json();
        data.fetchedAt = Date.now() / 1000;
        
        const prevVtt = normalizeVtt(currentData?.vtt);
        currentData = data;

        const newLocalTime = Date.now() / 1000;
        const projectedServerNow = baseServerNow + (newLocalTime - baseLocalTime);
        const serverAdvanced = data.serverNow > projectedServerNow;
        const audioIsAnchor = !audio.paused && anchorAudioTime > 0;

        if (!audioIsAnchor && (baseLocalTime === 0 || serverAdvanced)) {
            baseServerNow = data.serverNow;
            baseLocalTime = newLocalTime;
        }

        const trackChanged = data.title !== lastTrackTitle;
        const vttChanged = normalizeVtt(data.vtt) !== prevVtt; // prevVtt capturé avant l'écrasement
        
        let pendingTrackChange = false;

        if (trackChanged || vttChanged) {
            if (pendingTrackChange) return;
            pendingTrackChange = true;
            lastTrackTitle = data.title;
            
            const delay = Math.max(icecastBufferDelay, 0.5) * 1000;

            setTimeout(async () => {
                pendingTrackChange = false;
                subDiv.innerHTML = "";
                cuesIndex = [];
                hasSubtitles = false;
                
                const isNewShow = data.event !== displayedData?.event;
                if (isNewShow && (audio.paused || audio.ended)) {
                    audio.src = STREAM_URL + '?t=' + Date.now();
                }
                displayedData = data;
                updateUI(data);
                anchorAudioTime = 0;

                if (data.vtt) {
                    const vttRes = await fetch(data.vtt);
                    cuesIndex = parseVTT(await vttRes.text());
                    hasSubtitles = true;
                }
            }, delay);
        } else if (!data.vtt) {
            hasSubtitles = false;
            cuesIndex = [];
        }
    } catch (e) { console.error("Metadata Error:", e); }
    finally { isFetching = false; }
}

function animate() {
const activeData = displayedData || currentData;
    if (!activeData) { requestAnimationFrame(animate); return; }

    const now = Date.now() / 1000;
    const elapsed = now - baseLocalTime;
    const start = new Date(activeData.startedAt).getTime() / 1000;
    const durationRaw = activeData.duration_raw || 1;

    let currentPos;

    currentPos = (baseServerNow + elapsed) - start - icecastBufferDelay;

    // Sécurité pour ne pas dépasser la fin
    currentPos = Math.max(0, Math.min(currentPos, durationRaw));

    progressFill.style.width = (currentPos / durationRaw) * 100 + "%";
    time.innerText = formatTime(currentPos);
    duration.innerText = activeData.duration || "--:--";

    if (hasSubtitles && cuesIndex.length > 0 && !audio.paused) {
        const currentCue = cuesIndex.find(cue => currentPos >= cue.start && currentPos <= cue.end);
        const newText = currentCue ? currentCue.text : "";
        if (subDiv.innerHTML !== newText) subDiv.innerHTML = newText;
    } else if (!hasSubtitles || displayedData?.event === "Musique") {
        const durationRaw = activeData?.duration_raw || 0;
        if (currentPos >= durationRaw || audio.paused) {
            if (subDiv.innerHTML !== "") {
                subDiv.innerHTML = "";
                cuesIndex = [];
            }
        }
    }
    requestAnimationFrame(animate);
}

function updateUI(data) {
    title.innerText  = data.title  || "";
    artist.innerText = data.artist || "";
    album.innerText  = data.album  || "";
    document.getElementById('metadata').textContent = data.event;
    lastTrackTitle = data.title;
    updateCoverArt();
}

function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

const volumeSlider = document.getElementById('volume-slider');
function updateVolume() {
    const sliderValue = parseFloat(volumeSlider.value);
    audio.volume = Math.pow(sliderValue, 2);
}
updateVolume();
volumeSlider.addEventListener('input', updateVolume);

async function start() {
    await detectStream();
    fetchMetadata();
    animate();
    const res = await fetch(getStatusUrl() + '?t=' + Date.now());
    const data = await res.json();
    data.fetchedAt = Date.now() / 1000;
    updateUI(data);
    displayedData = data;
}

setInterval(fetchMetadata, 1000);
start();

// --- Schedule ---
const fullSchedule = [
    {h: 9,  t: "📰", desc: "News"},
    {h: 10, t: "🎙️", desc: "Chronique"},
    {h: 12, t: "🎙️", desc: "Chronique"},
    {h: 13, t: "📰", desc: "News"},
    {h: 15, t: "🎙️", desc: "Chronique"},
    {h: 17, t: "🎙️", desc: "Chronique"},
    {h: 20, t: "📰", desc: "News"}
];

function updateZoomTimeline() {
    const now = new Date();

    // 1. Trouver l'index basé sur le moment présent
    // On compare l'heure actuelle à l'heure prévue à Paris
    let currentIndex = fullSchedule.findIndex(s => {
        const eventInParis = new Date(new Date().toLocaleString("en-US", {timeZone: "Europe/Paris"}));
        eventInParis.setHours(s.h, 0, 0, 0);
        
        // Si l'événement est dans le futur ou dans la marge des 15 min
        return eventInParis > now || Math.abs(now - eventInParis) < 15 * 60000;
    });

    if (currentIndex === -1) currentIndex = 0;

    const selection = [];
    for (let i = -2; i <= 2; i++) {
        let idx = (currentIndex + i + fullSchedule.length) % fullSchedule.length;
        const item = fullSchedule[idx];

        // --- LA CONVERSION MAGIQUE ---
        // On crée une date fictive qui représente l'heure de Paris
        // "2024-01-01T09:00:00" dans le fuseau Europe/Paris
        const formatter = new Intl.DateTimeFormat('en-US', {
            timeZone: 'Europe/Paris',
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit',
            hour12: false
        });

        // On cherche à quelle heure locale correspond le "s.h" de Paris
        const parts = formatter.formatToParts(now);
        const dateStr = `${parts.find(p=>p.type==='year').value}-${parts.find(p=>p.type==='month').value}-${parts.find(p=>p.type==='day').value}T${item.h.toString().padStart(2, '0')}:00:00`;
        
        // On crée la date en spécifiant qu'il s'agit d'une heure de Paris
        const parisDate = new Date(new Date(dateStr).toLocaleString("en-US", {timeZone: "Europe/Paris"}));
        
        // .getHours() renverra l'heure locale (9h à Paris, 3h ou 4h à Québec)
        const localH = new Date(dateStr + "Z").toLocaleTimeString('fr-FR', {
            timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone, // Heure locale utilisateur
            hour: '2-digit',
            hour12: false
        }).replace('24', '00'); // Gère le format minuit

        // Pour éviter les bugs complexes de conversion inverse, voici la méthode la plus fiable :
        const diffDate = new Date();
        const parisTime = new Date(diffDate.toLocaleString("en-US", {timeZone: "Europe/Paris"}));
        const localTime = new Date(diffDate.toLocaleString("en-US"));
        const offset = (localTime - parisTime) / 3600000;
        
        const finalDisplayH = (item.h + Math.round(offset) + 24) % 24;

        selection.push({ 
            ...item, 
            displayH: finalDisplayH,
            isFocus: i === 0 
        });
    }

    // Rendu HTML
    const container = document.getElementById('zoom-timeline');
    if(!container) return;

    container.innerHTML = `
        <div class="row events">
            ${selection.map(s => `<div class="${s.isFocus ? 'focus' : ''}">${s.t}</div>`).join('')}
        </div>
        <div class="timeline-line"></div>
        <div class="row hours">
            ${selection.map(s => `<div class="${s.isFocus ? 'focus' : ''}">${s.displayH}h</div>`).join('')}
        </div>
        <div class="row descs">
            ${selection.map(s => `<div class="${s.isFocus ? 'focus' : ''}">${s.desc}</div>`).join('')}
        </div>
    `;
}

updateZoomTimeline();
setInterval(updateZoomTimeline, 60000);
</script>
