<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio DEV</title>
    <style>
        :root {
    --bg-dark: #0f0f12;
    --card-bg: #1a1a20;
    --accent: #bb86fc;
    --secondary: #03dac6;
    --text-main: #ffffff;
    --text-dim: #a0a0a0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-dark);
    background-image: radial-gradient(circle at 20% 30%, #251a3a 0%, var(--bg-dark) 70%);
    color: var(--text-main);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    padding: 20px;
}

.player-card {
    background: var(--card-bg);
    padding: 40px;
    border-radius: 24px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.05);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

h1 {
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
}

#metadata {
    font-size: 0.75rem;
    background: rgba(187, 134, 252, 0.15);
    color: var(--accent);
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: bold;
}

/* --- Album Art --- */
.album-art {
    background: linear-gradient(45deg, #2a2a2a, #3a3a3a);
    margin: 0 auto 25px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    width: 240px;
    height: 240px;
    overflow: hidden;
    position: relative;
    transition: box-shadow 0.4s ease;
}

.album-art.has-cover {
    box-shadow: 0 10px 40px rgba(187, 134, 252, 0.35), 0 0 0 1px rgba(187,134,252,0.15);
}

#cover-img {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 16px;
    opacity: 0;
    transition: opacity 0.4s ease;
}

#cover-img.visible { opacity: 1; }

#cover-emoji {
    font-size: 4rem;
    transition: opacity 0.3s ease;
    position: relative;
    z-index: 1;
}

/* --- Track Info --- */
.track-info { margin-bottom: 25px; }
#track-title  { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; display: block; }
#track-artist { font-size: 1rem; color: var(--accent); display: block; }
#track-album  { font-size: 0.85rem; color: var(--text-dim); margin-top: 4px; display: block; }

/* --- Progress Bar --- */
.progress-container { width: 100%; margin-bottom: 30px; }

.progress-bar {
    width: 100%;
    height: 6px;
    background: #333;
    border-radius: 3px;
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--secondary));
    border-radius: 3px;
}

.time-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 8px;
}

/* --- Controls --- */
.controls {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
}

#play-btn {
    background: var(--accent);
    color: #121212;
    border: none;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    font-size: 0;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(187, 134, 252, 0.4);
    -webkit-tap-highlight-color: transparent;
}

#play-btn::before {
    content: '';
    display: block;
    width: 0; height: 0;
    border-style: solid;
    border-width: 10px 0 10px 18px;
    border-color: transparent transparent transparent #121212;
    margin-left: 5px;
}

#play-btn.playing::before {
    width: 18px;
    height: 18px;
    background: #121212;
    border: none;
    margin: 0;
}

#play-btn.loading::before {
    display: none;
}

#play-btn.loading {
    background: transparent;
    box-shadow: none;
    cursor: default;
    pointer-events: none;
}

#play-btn.loading::after {
    content: '';
    display: block;
    width: 32px;
    height: 32px;
    border: 3px solid rgba(187, 134, 252, 0.25);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

#play-btn:hover { transform: scale(1.05); filter: brightness(1.1); }
#play-btn:active { transform: scale(0.95); }

/* --- Subtitles --- */
#subtitles {
    min-height: 3em;
    margin-top: 30px;
    font-size: 1rem;
    line-height: 1.5;
    color: var(--secondary);
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    border-top: 1px solid rgba(255,255,255,0.05);
    padding-top: 20px;
}

#debug {
    display: none;
    font-size: 0.7rem;
    color: var(--text-dim);
    text-align: center;
    margin-top: 8px;
    font-family: monospace;
}

#sync-btn {
    display: none;
    background: transparent;
    border: 1px solid var(--text-dim);
    color: var(--text-dim);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.8rem;
    cursor: pointer;
}
#sync-btn:hover { border-color: var(--secondary); color: var(--secondary); }

/* --- Volume --- */
.volume-container {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    width: 100%;
    max-width: 200px;
}

.volume-icon { font-size: 1.2rem; color: var(--text-dim); }

#volume-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: #333;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
}

#volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px; height: 14px;
    background: var(--secondary);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(3, 218, 198, 0.5);
    transition: transform 0.2s;
    border: none;
}

#volume-slider::-moz-range-thumb {
    width: 14px; height: 14px;
    background: var(--secondary);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(3, 218, 198, 0.5);
    transition: transform 0.2s;
    border: none;
}

#volume-slider::-webkit-slider-thumb:hover { transform: scale(1.3); }
#volume-slider::-moz-range-thumb:hover { transform: scale(1.3); }

/* --- Schedule --- */
.schedule-container {
    margin-top: 25px;
    padding-top: 15px;
    border-top: 1px solid rgba(255,255,255,0.05);
    position: relative;
}

.schedule-container h2 {
    font-size: 0.7rem;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 15px;
    text-align: center;
}

.timeline-single-row { display: flex; flex-direction: column; align-items: center; }

.row {
    display: flex;
    justify-content: space-between;
    width: 100%;
}

.row div {
    flex: 1;
    text-align: center;
    transition: all 0.3s ease;
    opacity: 0.4;
    cursor: default;
    padding: 5px 0;
}

.row div.focus { opacity: 1; transform: scale(1.15); color: var(--secondary); }

.events { font-size: 1.1rem; }
.hours  { font-size: 0.75rem; font-family: monospace; color: var(--text-dim); }
.descs  { font-size: 0.65rem; color: var(--text-dim); margin-top: 4px; }

.timeline-line {
    height: 1px;
    width: 100%;
    background: rgba(255,255,255,0.1);
    margin: 8px 0;
    position: relative;
}

.timeline-line::after {
    content: '';
    position: absolute;
    top: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 18%;
    height: 5px;
    background: var(--accent);
    border-radius: 4px;
    box-shadow: 0 0 10px var(--accent);
}

/* --- Portrait mobile --- */
@media (max-width: 768px) and (orientation: portrait) {
    .player-card { padding: 25px; border-radius: 18px; }
    .album-art   { width: 200px; height: 200px; }
    #cover-emoji { font-size: 3rem; }
    #track-title  { font-size: 1.3rem; }
    #track-artist { font-size: 0.95rem; }
}

@media (max-width: 480px) and (orientation: portrait) {
    body { padding: 10px; }
    .player-card  { padding: 20px; border-radius: 16px; }
    .header       { flex-direction: column; gap: 10px; }
    .album-art    { width: 160px; height: 160px; }
    #cover-emoji  { font-size: 2.5rem; }
    #track-title  { font-size: 1.1rem; }
    #track-artist { font-size: 0.9rem; }
    #play-btn     { width: 60px; height: 60px; }
    .volume-container { max-width: 100%; }
    #subtitles    { font-size: 0.9rem; min-height: 0.0em; }
}

/* --- Portrait mobile petit écran : masquer pochette --- */
@media (max-height: 800px) and (orientation: portrait) {
    .album-art { width: 100px; height: 100px; }
    .volume-container   { display: none; }
    .header { display: none; }
}

/* --- Paysage mobile (hauteur ≤ 500px) --- */
@media (orientation: landscape) and (max-height: 500px) {

    body {
        align-items: flex-start;
        padding: 6px 10px;
    }

    .player-card {
        padding: 10px 16px;
        border-radius: 12px;
        max-width: 100%;
        display: grid;
        grid-template-columns: 85px 1fr;
        grid-template-areas:
            "art header"
            "art info"
            "art progress"
            "art controls"
            "sched sched";
        column-gap: 16px;
        row-gap: 2px;
        text-align: left;
    }

    .album-art {
        grid-area: art;
        width: 85px;
        height: 85px;
        margin: 0 auto;
        align-self: center;
        justify-self: center;
        border-radius: 10px;
    }

    .header             { grid-area: header;   margin-bottom: 0; }
    .track-info         { grid-area: info;     margin-bottom: 0; }
    .progress-container { grid-area: progress; margin-bottom: 0; }
    .controls           { grid-area: controls; flex-direction: row; justify-content: flex-start; gap: 12px; }
    .schedule-container { grid-area: sched;    margin-top: 6px; padding-top: 6px; }

    #subtitles { display: none; }

    #track-title  { font-size: 0.9rem; }
    #track-artist { font-size: 0.78rem; }
    #track-album  { font-size: 0.7rem; }

    #play-btn { width: 44px; height: 44px; }
    .volume-container   { display: none; }

    h1        { font-size: 0.75rem; }
    #metadata { font-size: 0.65rem; padding: 3px 8px; }

    .schedule-container h2 { margin-bottom: 8px; }
    .events { font-size: 0.9rem; }
    .hours  { font-size: 0.65rem; }
    .descs  { font-size: 0.55rem; }
}

/* --- Grand écran PC (largeur ≥ 700px, hauteur ≥ 501px) --- */
@media (min-width: 700px) and (min-height: 501px) {

    body {
        align-items: center;
        padding: 40px;
    }

    .player-card {
        max-width: 1100px;
        padding: 50px 60px;
        border-radius: 32px;
        display: grid;
        grid-template-columns: 360px 1fr;
        grid-template-areas:
            "art header"
            "art info"
            "art progress"
            "art controls"
            "sched sched"
            "sub sub";
        column-gap: 60px;
        row-gap: 16px;
        text-align: left;
    }

    .album-art {
        grid-area: art;
        width: 340px;
        height: 340px;
        margin: 0 auto;
        align-self: center;
        justify-self: center;
        border-radius: 20px;
    }

    #cover-emoji  { font-size: 6rem; }
    #track-title  { font-size: 2.2rem; }
    #track-artist { font-size: 1.3rem; }
    #track-album  { font-size: 1rem; }

    .header             { grid-area: header;   margin-bottom: 0; }
    h1                  { font-size: 1.1rem; letter-spacing: 3px; }
    #metadata           { font-size: 0.9rem; padding: 6px 16px; }

    .track-info         { grid-area: info;     margin-bottom: 0; }
    .progress-container { grid-area: progress; margin-bottom: 0; }
    .progress-bar       { height: 8px; }

    .controls           { grid-area: controls; flex-direction: row; justify-content: flex-start; gap: 24px; }
    #play-btn           { width: 90px; height: 90px; }
    #play-btn::before   { border-width: 14px 0 14px 24px; }
    #play-btn.playing::before { width: 24px; height: 24px; }
    .volume-container   { max-width: 260px; margin-top: 0; }

    .schedule-container { grid-area: sched; margin-top: 20px; padding-top: 20px; }
    .schedule-container h2 { font-size: 0.85rem; margin-bottom: 16px; }
    .events             { font-size: 1.5rem; }
    .hours              { font-size: 0.9rem; }
    .descs              { font-size: 0.8rem; }

    #subtitles          { grid-area: sub; margin-top: 0; font-size: 1.2rem; min-height: 2em; }
}
    </style>
</head>
<body>

<div class="player-card">
    <div class="header">
        <h1>Direct</h1>
        <div id="metadata">Connexion...</div>
    </div>

    <div class="album-art" id="album-art-container">
        <img id="cover-img" src="" alt="Pochette" />
        <span id="cover-emoji">📻</span>
    </div>

    <div class="track-info">
        <span id="track-title">Titre</span>
        <span id="track-artist">Artiste</span>
        <span id="track-album">Album</span>
    </div>

    <div class="progress-container">
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="time-info">
            <span id="current-time">LIVE</span>
            <span id="duration">--:--</span>
        </div>
    </div>

    <div class="controls">
        <audio id="radio-audio">
            <!-- src injecté dynamiquement par détectStream() -->
        </audio>

        <button id="play-btn" onclick="togglePlay()"></button>
        <button id="sync-btn" onclick="syncNow()" title="Cliquer au début d'un nouveau morceau">
            🎯 Sync
        </button>
        <div class="volume-container">
            <span class="volume-icon">🔈</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
            <span class="volume-icon">🔊</span>
        </div>
    </div>

    <div id="subtitles"></div>
    <div class="schedule-container">
        <h2>Programme</h2>
        <div class="timeline-wrapper">
            <div id="zoom-timeline" class="timeline-single-row"></div>
            <div id="timeline-tooltip" class="timeline-tooltip"></div>
        </div>
    </div>
    <div id="debug"></div>
</div>

<script>
// =============================================================================
// ÉLÉMENTS DOM
// =============================================================================
const audio             = document.getElementById('radio-audio');
const subDiv            = document.getElementById('subtitles');
const debugDiv          = document.getElementById('debug');
const playBtn           = document.getElementById('play-btn');
const syncBtn           = document.getElementById('sync-btn');
const albumEl           = document.getElementById('track-album');
const artistEl          = document.getElementById('track-artist');
const titleEl           = document.getElementById('track-title');
const timeEl            = document.getElementById('current-time');
const durationEl        = document.getElementById('duration');
const progressFill      = document.getElementById('progress-fill');
const coverImg          = document.getElementById('cover-img');
const coverEmoji        = document.getElementById('cover-emoji');
const albumArtContainer = document.getElementById('album-art-container');

// =============================================================================
// ÉTAT
// =============================================================================

// Horloge serveur : à tout moment, l'heure serveur estimée est :
//   baseServerNow + (Date.now()/1000 - baseLocalTime)
let baseServerNow = 0;
let baseLocalTime = 0;

// Lag de transit Paris→client (réseau + buffer Icecast + buffer navigateur).
// Seule source de vérité : le bouton Sync ou le localStorage.
const _cached = parseFloat(localStorage.getItem('icecastLag') || '0');
let lag = (_cached > 0 && _cached < 60) ? _cached : 0;

// Métadonnées
let currentData   = null;  // dernière donnée reçue du serveur
let displayedData = null;  // donnée actuellement affichée dans l'UI
let lastTitle     = '';
let isFetching    = false;

// VTT / sous-titres
let cues        = [];
let hasSubtitles = false;

// Reconnexion audio
let waitingTimeout = null;

// URL du flux, détectée au démarrage
let STREAM_URL = '/icecast/radio-public';

// =============================================================================
// DÉTECTION DU FLUX
// =============================================================================

function detectStream() {
    const localHosts = ['192.168.1.20', 'radio-local.adrien-dev.fr'];
    STREAM_URL = localHosts.includes(window.location.hostname)
        ? '/icecast/radio-local'
        : '/icecast/radio-public';
    audio.src = STREAM_URL;
    console.log('Stream :', STREAM_URL);
}

function getStatusUrl() {
    return STREAM_URL.includes('radio-local')
        ? '/data/status-radio-local.json'
        : '/data/status-radio-public.json';
}

function getCoverUrl() {
    return STREAM_URL.includes('radio-local')
        ? '/cover-radio-local.jpg'
        : '/cover-radio-public.jpg';
}

// =============================================================================
// HORLOGE SERVEUR
// =============================================================================

// Retourne l'heure serveur estimée à cet instant (en secondes unix).
function serverNow() {
    return baseServerNow + (Date.now() / 1000 - baseLocalTime);
}

// Met à jour l'ancre serveur depuis une réponse JSON.
// On ajoute le demi-RTT pour corriger le délai de transit HTTP.
function updateServerClock(data, rtt) {
    const estimated = data.serverNow + rtt / 2;
    // Ne jamais reculer l'horloge
    if (estimated > baseServerNow) {
        baseServerNow = estimated;
        baseLocalTime = Date.now() / 1000;
    }
}

// =============================================================================
// POSITION DANS LE MORCEAU
// =============================================================================

// Retourne la position estimée en secondes dans le morceau actuellement joué,
// corrigée du lag de transit.
function currentPos(data) {
    if (!data) return 0;
    const start = new Date(data.startedAt).getTime() / 1000;
    const pos = serverNow() - start - lag;
    return Math.max(0, Math.min(pos, data.duration_raw || 0));
}

// =============================================================================
// SYNC MANUEL (bouton 🎯)
// =============================================================================

// L'utilisateur clique exactement quand il entend le premier son d'un nouveau
// morceau. À cet instant, le serveur a déjà joué (serverNow - startedAt) secondes
// de ce morceau. Ce delta est le lag réel.
function syncNow() {
    if (!currentData) return;
    const start = new Date(currentData.startedAt).getTime() / 1000;
    const measured = serverNow() - start;
    if (measured > 0 && measured < 60) {
        lag = measured;
        localStorage.setItem('icecastLag', lag.toFixed(2));
        renderDebug(`lag: ${lag.toFixed(1)}s ✓ (sync manuel)`);
        syncBtn.textContent = `🎯 ${lag.toFixed(1)}s`;
    }
}

// =============================================================================
// AUDIO : ÉVÉNEMENTS
// =============================================================================

audio.addEventListener('ended', () => {
    playBtn.classList.remove('playing', 'loading');
});

audio.addEventListener('error', () => {
    playBtn.classList.remove('playing', 'loading');
    if (audio.error?.code === 2) {
        console.warn('Erreur réseau, retry dans 3s...');
        setTimeout(() => {
            if (!audio.paused) reconnectAudio();
        }, 3000);
    }
});

audio.addEventListener('waiting', () => {
    if (!audio.paused) {
        playBtn.classList.add('loading');
        playBtn.classList.remove('playing');
        waitingTimeout = setTimeout(() => {
            if (!audio.paused && playBtn.classList.contains('loading')) {
                reconnectAudio();
            }
        }, 5000);
    }
});

audio.addEventListener('playing', () => {
    clearTimeout(waitingTimeout);
    playBtn.classList.remove('loading');
    playBtn.classList.add('playing');
    renderDebug(`lag: ${lag.toFixed(1)}s`);
});

function reconnectAudio() {
    const vol = audio.volume;
    audio.src = STREAM_URL + '?t=' + Date.now();
    audio.volume = vol;
    audio.play().catch(console.error);
}

// =============================================================================
// LECTURE / PAUSE
// =============================================================================

function togglePlay() {
    if (audio.paused) {
        reconnectAudio();
        playBtn.classList.remove('playing');
        playBtn.classList.add('loading');
    } else {
        audio.pause();
        playBtn.classList.remove('playing');
        subDiv.innerHTML = '';
    }
}

// =============================================================================
// POCHETTE
// =============================================================================

function updateCoverArt() {
    const tempImg = new Image();
    tempImg.onload = () => {
        coverImg.src = tempImg.src;
        coverImg.classList.add('visible');
        coverEmoji.style.opacity = '0';
        albumArtContainer.classList.add('has-cover');
    };
    tempImg.onerror = () => {
        coverImg.classList.remove('visible');
        coverEmoji.style.opacity = '1';
        albumArtContainer.classList.remove('has-cover');
    };
    tempImg.src = getCoverUrl() + '?t=' + Date.now();
}

// =============================================================================
// VTT / SOUS-TITRES
// =============================================================================

function normalizeVtt(url) { return url ? url.split('?')[0] : ''; }

function parseVttTime(t) {
    const p = t.trim().replace(',', '.').split(':').map(Number);
    return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1];
}

function parseVTT(text) {
    const result = [];
    for (const block of text.split(/\n\s*\n/)) {
        const lines = block.split('\n').map(l => l.trim());
        const tl = lines.find(l => l.includes('-->'));
        if (!tl) continue;
        const [s, e] = tl.split('-->');
        const textIdx = lines.indexOf(tl) + 1;
        const cueText = lines.slice(textIdx).join(' ').trim();
        if (cueText) result.push({ start: parseVttTime(s), end: parseVttTime(e), text: cueText });
    }
    return result;
}

// =============================================================================
// FETCH MÉTADONNÉES
// =============================================================================

async function fetchMetadata() {
    if (isFetching) return;
    isFetching = true;
    try {
        const t0 = Date.now() / 1000;
        const res = await fetch(getStatusUrl() + '?t=' + Date.now());
        const data = await res.json();
        const rtt = Date.now() / 1000 - t0;

        updateServerClock(data, rtt);

        const prevVtt   = normalizeVtt(currentData?.vtt);
        const prevTitle = currentData?.title;
        currentData = data;

        const titleChanged = data.title !== lastTitle;
        const vttChanged   = normalizeVtt(data.vtt) !== prevVtt;

        if (titleChanged || vttChanged) {
            lastTitle = data.title;

            // Retarder l'affichage du nouveau titre du lag, pour que l'UI
            // change en même temps que ce que l'auditeur entend.
            setTimeout(async () => {
                cues = [];
                hasSubtitles = false;
                subDiv.innerHTML = '';

                const isNewShow = data.event !== displayedData?.event;
                if (isNewShow && audio.paused) {
                    audio.src = STREAM_URL + '?t=' + Date.now();
                }

                displayedData = data;
                renderTrackInfo(data);
                updateCoverArt();

                if (data.vtt) {
                    try {
                        const vttRes = await fetch(data.vtt);
                        cues = parseVTT(await vttRes.text());
                        hasSubtitles = true;
                    } catch (e) { console.error('VTT fetch error:', e); }
                }
            }, lag * 1000);
        }
    } catch (e) { console.error('Metadata error:', e); }
    finally { isFetching = false; }
}

// =============================================================================
// RENDU UI
// =============================================================================

function renderTrackInfo(data) {
    titleEl.innerText  = data.title  || '';
    artistEl.innerText = data.artist || '';
    albumEl.innerText  = data.album  || '';
    document.getElementById('metadata').textContent = data.event || '';
}

function renderDebug(msg) {
    debugDiv.style.display = 'block';
    debugDiv.textContent = msg;
}

function formatTime(s) {
    const m = Math.floor(s / 60);
    return `${String(Math.floor(m)).padStart(2,'0')}:${String(Math.floor(s % 60)).padStart(2,'0')}`;
}

// =============================================================================
// BOUCLE D'ANIMATION
// =============================================================================

function animate() {
    const data = displayedData || currentData;
    if (data) {
        const pos = currentPos(data);
        const dur = data.duration_raw || 1;

        progressFill.style.width = (pos / dur * 100) + '%';
        timeEl.innerText     = formatTime(pos);
        durationEl.innerText = data.duration || '--:--';

        if (hasSubtitles && cues.length > 0 && !audio.paused) {
            const cue = cues.find(c => pos >= c.start && pos <= c.end);
            const txt = cue ? cue.text : '';
            if (subDiv.innerHTML !== txt) subDiv.innerHTML = txt;
        } else if (!hasSubtitles || data.event === 'Musique') {
            if (pos >= dur || audio.paused) {
                if (subDiv.innerHTML) { subDiv.innerHTML = ''; cues = []; }
            }
        }
    }
    requestAnimationFrame(animate);
}

// =============================================================================
// VOLUME
// =============================================================================

const volumeSlider = document.getElementById('volume-slider');
function updateVolume() {
    audio.volume = Math.pow(parseFloat(volumeSlider.value), 2);
}
updateVolume();
volumeSlider.addEventListener('input', updateVolume);

// =============================================================================
// DÉMARRAGE
// =============================================================================

async function start() {
    detectStream();

    // Premier fetch : initialise l'horloge serveur avec correction RTT
    const t0 = Date.now() / 1000;
    const res = await fetch(getStatusUrl() + '?t=' + Date.now());
    const data = await res.json();
    const rtt = Date.now() / 1000 - t0;
    updateServerClock(data, rtt);

    currentData   = data;
    displayedData = data;
    lastTitle     = data.title;
    renderTrackInfo(data);
    updateCoverArt();

    if (data.vtt) {
        try {
            const vttRes = await fetch(data.vtt);
            cues = parseVTT(await vttRes.text());
            hasSubtitles = true;
        } catch(e) {}
    }

    // Affiche le bouton sync et le lag en cours
    syncBtn.style.display = 'inline-block';
    syncBtn.textContent = lag > 0 ? `🎯 ${lag.toFixed(1)}s` : '🎯 Sync';
    renderDebug(lag > 0 ? `lag: ${lag.toFixed(1)}s (cache)` : 'lag: 0s — cliquer 🎯 au début d\'un morceau');

    animate();
    setInterval(fetchMetadata, 1000);
}

start();

// =============================================================================
// TIMELINE DU PROGRAMME
// =============================================================================

const fullSchedule = [
    {h: 9,  t: "📰", desc: "News"},
    {h: 10, t: "🎙️", desc: "Chronique"},
    {h: 12, t: "🎙️", desc: "Chronique"},
    {h: 13, t: "📰", desc: "News"},
    {h: 15, t: "🎙️", desc: "Chronique"},
    {h: 17, t: "🎙️", desc: "Chronique"},
    {h: 20, t: "📰", desc: "News"}
];

function parisHourToLocal(h) {
    // Calcule le décalage Paris → local en heures entières
    const now = new Date();
    const parisTime = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Paris"}));
    const localTime = new Date(now.toLocaleString("en-US"));
    const offsetH   = Math.round((localTime - parisTime) / 3600000);
    return (h + offsetH + 24) % 24;
}

function updateZoomTimeline() {
    const now = new Date();
    const parisNow = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Paris"}));
    const nowMin   = parisNow.getHours() * 60 + parisNow.getMinutes();

    // Trouver l'événement courant ou prochain (dans la fenêtre de 15 min)
    let currentIndex = fullSchedule.findIndex(s => {
        const eventMin = s.h * 60;
        return eventMin > nowMin || Math.abs(nowMin - eventMin) < 15;
    });
    if (currentIndex === -1) currentIndex = 0;

    const selection = [];
    for (let i = -2; i <= 2; i++) {
        const idx  = (currentIndex + i + fullSchedule.length) % fullSchedule.length;
        const item = fullSchedule[idx];
        selection.push({
            ...item,
            displayH: parisHourToLocal(item.h),
            isFocus:  i === 0
        });
    }

    const container = document.getElementById('zoom-timeline');
    if (!container) return;
    container.innerHTML = `
        <div class="row events">
            ${selection.map(s => `<div class="${s.isFocus ? 'focus' : ''}">${s.t}</div>`).join('')}
        </div>
        <div class="timeline-line"></div>
        <div class="row hours">
            ${selection.map(s => `<div class="${s.isFocus ? 'focus' : ''}">${s.displayH}h</div>`).join('')}
        </div>
        <div class="row descs">
            ${selection.map(s => `<div class="${s.isFocus ? 'focus' : ''}">${s.desc}</div>`).join('')}
        </div>
    `;
}

updateZoomTimeline();
setInterval(updateZoomTimeline, 60000);


</script>
