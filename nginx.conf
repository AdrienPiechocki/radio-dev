server {
    resolver 127.0.0.11 valid=30s;
    listen 80;

# =========================
# REAL IP (Traefik → vrai IP client)
# =========================
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 172.17.0.0/16;
    set_real_ip_from 172.18.0.0/16;
    set_real_ip_from 172.19.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

# =========================
# FRONT
# =========================
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

# =========================
# DATA BRUT
# =========================
    location /data/ {
        alias /data/;
        autoindex off;
    }

# =========================
# PODCASTS (VTT + AUDIO)
# =========================
    location /podcasts/ {
        alias /data/podcasts/;
        types {
            text/vtt vtt;
            audio/wav wav;
            audio/mpeg mp3;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }

# =========================
# RADIO GEN (news, météo…)
# =========================
    location /radio-gen/ {
        alias /data/radio-gen/;
        types {
            text/vtt vtt;
            audio/wav wav;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }

# =========================
# ICECAST — STREAM LOCAL UNIQUEMENT
# =========================
    location /icecast/radio-local {
        allow 192.168.1.0/24;
        allow 127.0.0.1;
        deny all;

        set $upstream_icecast http://radio-icecast:8000;
        proxy_pass $upstream_icecast/radio-local;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass_request_headers on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

# =========================
# ICECAST — STREAM PUBLIC
# =========================
    location /icecast/radio-public {
        set $upstream_icecast http://radio-icecast:8000;
        proxy_pass $upstream_icecast/radio-public;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass_request_headers on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

# =========================
# ICECAST — PROXY GÉNÉRAL (admin, status…)
# =========================
    location /icecast/ {
        allow 192.168.1.0/24;
        allow 127.0.0.1;
        deny all;

        set $upstream_icecast http://radio-icecast:8000;
        proxy_pass $upstream_icecast/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass_request_headers on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

# =========================
# STATUS JSON
# =========================
    location /data/status-radio-local.json {
        alias /data/status-radio-local.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }

    location /data/status-radio-public.json {
        alias /data/status-radio-public.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }
# =========================
# DÉTECTION RÉSEAU LOCAL
# =========================
    location /local-check {
        allow 192.168.1.0/24;
        allow 127.0.0.1;
        deny all;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}