server {
    listen 80;

# =========================
# FRONT
# =========================
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

# =========================
# DATA BRUT
# =========================
    location /data/ {
        alias /data/;
        autoindex off;
    }

# =========================
# PODCASTS (VTT + AUDIO)
# =========================
    location /podcasts/ {
        alias /data/podcasts/;
        types {
            text/vtt vtt;
            audio/wav wav;
            audio/mpeg mp3;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }

# =========================
# RADIO GEN (news, météo…)
# =========================
    location /radio-gen/ {
        alias /data/radio-gen/;
        types {
            text/vtt vtt;
            audio/wav wav;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }

# =========================
# ICECAST — STREAM LOCAL UNIQUEMENT
# Accessible uniquement depuis le réseau local
# =========================
    location /icecast/radio-local {
        # Adapte ces plages à ton réseau (ifconfig / ip a)
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://radio-icecast:8000/radio-local;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass_request_headers on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

# =========================
# ICECAST — STREAM PUBLIC
# Accessible depuis n'importe où
# =========================
    location /icecast/radio-public {
        proxy_pass http://radio-icecast:8000/radio-public;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass_request_headers on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

# =========================
# ICECAST — PROXY GÉNÉRAL
# (admin, status, autres mounts)
# =========================
    location /icecast/ {
        proxy_pass http://radio-icecast:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass_request_headers on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }
}